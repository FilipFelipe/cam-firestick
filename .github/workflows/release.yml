name: Release

# Publica um Release com o APK assinado.
#   - Automático: git tag v0.2.0 && git push origin v0.2.0
#   - Manual: Actions > Release > Run workflow (informe a tag)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (ex.: v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão a partir da tag
        run: |
          V="${TAG#v}"
          if [[ ! "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag inválida '$TAG'. Use o formato vX.Y.Z (ex.: v0.2.0)."
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versão $V (versionCode $CODE)"

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::Secret $s não configurado (Settings > Secrets and variables > Actions)."; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: ./gradlew assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE" --no-daemon

      - name: Conferir assinatura
        run: |
          APK="app/build/outputs/apk/release/cam-firestick-v$VERSION-release.apk"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate DN|SHA-256"
          # Garante que não saiu assinado com a chave de debug
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK assinado com chave de debug."; exit 1
          fi

      - name: Preparar arquivos
        run: |
          mkdir -p dist
          cp "app/build/outputs/apk/release/cam-firestick-v$VERSION-release.apk" "dist/cam-firestick-$TAG.apk"
          (cd dist && sha256sum "cam-firestick-$TAG.apk" > "cam-firestick-$TAG.apk.sha256")
          SHA=$(cut -d' ' -f1 "dist/cam-firestick-$TAG.apk.sha256")
          if [ -f "docs/release-notes/$TAG.md" ]; then
            cp "docs/release-notes/$TAG.md" notes.md
          else
            {
              echo "> ⚠️ **Disclaimer / Aviso:** provided as is, without warranty. Use at your own risk; the author is not responsible for any damage. Only tested on a Fire TV Stick HD (AFTSS, Fire OS 7) via sideload."
              echo ">"
              echo "> Fornecido como está, sem garantia. Uso por sua conta e risco; o autor não se responsabiliza por danos. Testado apenas no Fire TV Stick HD (AFTSS, Fire OS 7) via sideload."
            } > notes.md
          fi
          printf '\n---\n\n**SHA-256** (`cam-firestick-%s.apk`):\n\n```\n%s\n```\n' "$TAG" "$SHA" >> notes.md
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "Central de Câmeras $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
